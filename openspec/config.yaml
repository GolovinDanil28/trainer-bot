schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Проект — учебный хаб. Спеки пишутся так, чтобы по ним мог реализовать
  человек, знающий Python, но не знающий этот проект.

rules:
  proposal:
    - Keep proposals under 400 words
    - Always state what is out of scope
    - Обязательная секция Why — какую проблему пользователя решаем
    - Если изменение затрагивает больше одного проекта из ПРОЕКТЫ.md — перечислить все
  design:
    - Обязательно указать минимум одну альтернативу, которую отвергли, и почему
    - Описать модель данных, если состояние хранится
    - Указать риски и как они снимаются
  tasks:
    - Break tasks into chunks of max 2 hours
    - Каждый пункт должен ссылаться на требование, например (R-01)
    - Каждый пункт должен заканчиваться работающим тестом
    - Пункты, требующие решения пользователя, помечать [ТРЕБУЕТ УТВЕРЖДЕНИЯ]

operations:
  apply:
    guidance:
      - Один пункт tasks.md за раз, с тестом
      - Не выходить за рамки утверждённой спеки
      - Отмечать - [x] только после успешного прогона тестов
  archive:
    guidance:
      - Перед архивированием убедиться, что каждое требование закрыто тестом
      - В отчёте указать, какие требования остались без теста
